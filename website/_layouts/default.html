<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/install/' | relative_url }}">Install</a>
      <a href="{{ '/tui/' | relative_url }}">TUI</a>
      <a href="{{ '/cli/' | relative_url }}">CLI</a>
      <a href="{{ '/configuration/' | relative_url }}">Config</a>
      <a href="{{ '/api/' | relative_url }}">API</a>
      <a href="{{ '/agents/' | relative_url }}">Agents</a>
      <a href="{{ '/behavior/' | relative_url }}">Behavior</a>
      <a href="https://github.com/thanhphuchuynh/lazycomd">GitHub</a>
    </nav>
  </header>
  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
</body>
</html>
