name: docs

# GitHub's github-pages environment allows the default branch by default,
# not tags. Deploy from main so a v* release does not get rejected.
# Re-run: Actions → docs → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install mint and staticmint
        run: |
          npm i -g mint
          go install github.com/migetapp/staticmint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Export static site
        run: staticmint -start-server -docs website -out _site -site-url https://thanhphuchuynh.github.io/lazycomd

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
